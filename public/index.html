<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-xl p-4 sm:p-8">
    <h1 class="mb-6 text-3xl font-bold">Test App</h1>
    <div class="rounded-xl bg-white p-6 shadow">
      <div class="mb-1 flex justify-between text-sm text-slate-500">
        <span id="step"></span>
      </div>
      <div class="mb-6 h-2 overflow-hidden rounded bg-slate-200">
        <div id="bar" class="h-full w-0 bg-indigo-600 transition-all"></div>
      </div>
      <div id="card"></div>
      <p id="error" class="mt-3 hidden text-sm text-red-600"></p>
      <button id="next" disabled
        class="mt-6 w-full rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white disabled:cursor-not-allowed disabled:opacity-40">
        Next
      </button>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
